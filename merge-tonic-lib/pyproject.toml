[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mergetonic"
version = "0.1.0"
description = "Deterministic merge / conflict engine (CRDT weave) for version control"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-only" }
authors = [{ name = "Merge Tonic contributors" }]
dependencies = ["typing_extensions>=4.6.0"]

[project.urls]
Documentation = "https://github.com/mergetonic/common/wiki/Core-Python-mergetonic"
Repository = "https://github.com/mergetonic/common"
Issues = "https://github.com/mergetonic/common/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
ai = ["chromadb>=0.5.0"]
hf-weave = ["huggingface_hub>=0.26.0"]

[project.scripts]
mergetonic = "tonic.cli:main"
merge-tonic = "tonic.cli:main"
tonic-merge = "tonic.cli:main"
mt = "tonic.cli:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["."]
namespaces = false

[tool.setuptools.package-data]
tonic = ["data/ast_grep_rules/*.yml", "data/ast_grep_rules/*.yaml", "data/hydration_prompts_embed.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
