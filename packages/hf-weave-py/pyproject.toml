[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mergetonic-hf-weave"
version = "0.1.0"
description = "Hugging Face hf weave CLI extension and Hub helpers for Merge Tonic"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-only" }
dependencies = [
  "mergetonic>=0.1.0",
  "huggingface_hub>=0.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
hf-weave = "mergetonic_hf_weave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
