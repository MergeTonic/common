name: Tonic Agent
description: Post Tonic merge visualization comments on pull requests
inputs:
  token:
    description: GitHub token with PR comment permissions
    required: true
  comment_mode:
    description: summary-only | file+inline | inline-only | all
    required: false
    default: all
  verbosity:
    description: low | medium | high
    required: false
    default: medium
  max_inline_comments_per_file:
    description: Cap for inline review threads per file
    required: false
    default: "20"
  max_suggestion_lines:
    description: Max lines per GitHub suggestion block (use 0 for uncapped; GitHub may still reject very large bodies)
    required: false
    default: "200"
  enable_ai:
    description: "true to enable optional AI (requires API keys)"
    required: false
    default: "false"
  enable_checks:
    description: "true to post a GitHub Check run with annotations (requires checks:write on the token)"
    required: false
    default: "false"
  author_mode:
    description: "git-merge hydration: base-head | human | ref (author tags on Tonic markers)"
    required: false
    default: base-head
  author_alias_left:
    description: Optional explicit author tag for base (left) side
    required: false
    default: ""
  author_alias_right:
    description: Optional explicit author tag for head (right) side
    required: false
    default: ""
  intent_pair:
    description: "Optional left,right intent tags, e.g. preserve_base,prefer_head"
    required: false
    default: ""
  enable_ast_hydration:
    description: "true to run merge-tonic ast-grep-hydrate in the workspace before comments"
    required: false
    default: "false"
  ast_grep_version:
    description: "When enable_ast_hydration is true, npm version of @ast-grep/cli to install so `sg` is on PATH"
    required: false
    default: "0.39.0"
  ast_hydration_extra_args:
    description: "Extra CLI tokens for ast-grep-hydrate or hydrate (space-separated). Retrieval flags (--enable-retrieval, --retrieval-backend) and Chroma/embeddings env are documented in this action's README and docs/retrieval-hydration.md."
    required: false
    default: ""
  ast_hydration_subcommand:
    description: "ast-grep-hydrate (default) or hydrate for full multi-phase pipeline under .tonic/hydrate-out"
    required: false
    default: "ast-grep-hydrate"
  ast_hydration_strict:
    description: "true to fail the action when ast-grep-hydrate exits non-zero (except partial 13)"
    required: false
    default: "false"
  hydration_user_query:
    description: "Optional --user-query for merge-tonic hydrate (hydrate subcommand only)"
    required: false
    default: ""
  hydration_follow_up:
    description: "Optional --follow-up for merge-tonic hydrate"
    required: false
    default: ""
  hydration_prior_run:
    description: "Optional --prior-run path for merge-tonic hydrate"
    required: false
    default: ""
  hydration_question_mode:
    description: "For hydrate subcommand: off | on | auto (LLM question refinement; default off)"
    required: false
    default: "off"
  merge_llm_include_run_summary:
    description: "Deprecated (no-op). Run summary is always included when a hydration run JSON is present."
    required: false
    default: "false"
  github_login_left:
    description: Optional GitHub login for left author tag when author_mode is not ref
    required: false
    default: ""
  github_login_right:
    description: Optional GitHub login for right author tag
    required: false
    default: ""
  hydrate_mode:
    description: "pr-diff (compare API) or symmetric-union (full tree union); used only when merge_engine=api"
    required: false
    default: pr-diff
  merge_engine:
    description: "git (default, real git merge in isolated workspace) or api"
    required: false
    default: git
  report_path:
    description: "VS Code Import merge report — writes merge-tonic-report JSON here; conflicted files always include annotated_lines (no need for verbosity high on the artifact)."
    required: false
    default: ""
  enable_blame:
    description: "true to include optional blame metadata in report/comments"
    required: false
    default: "false"
  blame_max_commits:
    description: "Maximum commit ids to include per side in blame summaries"
    required: false
    default: "3"
  tonic_version:
    description: "PyPI version of tonic when not using the mergetonic workspace (editable install)"
    required: false
    default: "0.1.0"
  tonic_github_agent_version:
    description: "PyPI version of mergetonic-github-agent when not using the mergetonic workspace"
    required: false
    default: "0.1.0"
  tonic_chroma_url:
    description: "Optional; sets TONIC_CHROMA_URL for hydrate retrieval (Chroma HTTP API base). Empty omits the variable."
    required: false
    default: ""
  tonic_chroma_collection:
    description: "Optional; sets TONIC_CHROMA_COLLECTION (empty = omit; runtime default applies when unset)."
    required: false
    default: ""
  tonic_retrieval_backend:
    description: "Optional; sets TONIC_RETRIEVAL_BACKEND (memory or chroma). Overrides CLI --retrieval-backend when set. Empty omits."
    required: false
    default: ""
  tonic_embedding_base_url:
    description: "Optional; sets TONIC_EMBEDDING_BASE_URL for OpenAI-compatible embeddings HTTP. Empty omits."
    required: false
    default: ""
  tonic_embedding_backend:
    description: "Optional; sets TONIC_EMBEDDING_BACKEND (auto, histogram, openai_compatible, hf_inference). Empty omits."
    required: false
    default: ""
  hf_token:
    description: "Optional Hugging Face token (pass via secrets); used when backends select Inference Providers."
    required: false
    default: ""
  tonic_llm_backend:
    description: "Optional; sets TONIC_LLM_BACKEND (e.g. hf_inference). Empty omits."
    required: false
    default: ""
  tonic_hf_chat_model:
    description: "Optional; sets TONIC_HF_CHAT_MODEL for hf_inference chat."
    required: false
    default: ""
  tonic_hf_embed_model:
    description: "Optional; sets TONIC_HF_EMBED_MODEL for hf_inference embeddings."
    required: false
    default: ""
  tonic_hf_inference_provider:
    description: "Optional; sets TONIC_HF_INFERENCE_PROVIDER for huggingface_hub InferenceClient."
    required: false
    default: ""
outputs:
  status:
    description: "Run status (ok or demo)"
    value: ${{ steps.run_agent.outputs.status }}
  files_analyzed:
    description: "Number of files analyzed by the agent"
    value: ${{ steps.run_agent.outputs.files_analyzed }}
  conflicted_files:
    description: "Number of files with conflict markers"
    value: ${{ steps.run_agent.outputs.conflicted_files }}
  report_path:
    description: "Report path if requested"
    value: ${{ steps.run_agent.outputs.report_path }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - uses: actions/checkout@v4
      if: ${{ inputs.merge_engine == 'git' }}
      with:
        fetch-depth: 0
    - name: Capture immutable PR targets
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        if [ "${EVENT_NAME}" = "pull_request" ]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          PR_NUM="${{ github.event.pull_request.number }}"
        elif [ "${EVENT_NAME}" = "issue_comment" ]; then
          PR_NUM="${{ github.event.issue.number }}"
          PR_JSON="${RUNNER_TEMP}/tonic-pull.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUM}" > "${PR_JSON}"
          BASE_SHA="$(jq -r '.base.sha' "${PR_JSON}")"
          HEAD_SHA="$(jq -r '.head.sha' "${PR_JSON}")"
          BASE_REF="$(jq -r '.base.ref' "${PR_JSON}")"
          echo "TONIC_PULL_REQUEST_JSON=${PR_JSON}" >> "${GITHUB_ENV}"
        else
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          PR_NUM="${{ github.event.pull_request.number }}"
        fi
        {
          echo "TONIC_TARGET_BASE_SHA=${BASE_SHA}"
          echo "TONIC_TARGET_HEAD_SHA=${HEAD_SHA}"
          echo "TONIC_TARGET_BASE_BRANCH=${BASE_REF}"
          echo "TONIC_PR_NUMBER=${PR_NUM}"
        } >> "${GITHUB_ENV}"
    - name: Prepare isolated git workspace
      if: ${{ inputs.merge_engine == 'git' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        TARGET_BASE_SHA="${TONIC_TARGET_BASE_SHA:?missing TONIC_TARGET_BASE_SHA}"
        TARGET_HEAD_SHA="${TONIC_TARGET_HEAD_SHA:?missing TONIC_TARGET_HEAD_SHA}"
        PR_NUMBER="${TONIC_PR_NUMBER:?missing TONIC_PR_NUMBER}"
        if ! git fetch origin "${TARGET_BASE_SHA}" "${TARGET_HEAD_SHA}" --no-tags; then
          git fetch origin "${TARGET_BASE_SHA}" "refs/pull/${PR_NUMBER}/head" --no-tags
          TARGET_HEAD_SHA="$(git rev-parse FETCH_HEAD)"
        fi
        ISO_DIR="${RUNNER_TEMP}/tonic-agent-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        if ! git worktree add --detach "${ISO_DIR}" "${TARGET_BASE_SHA}"; then
          rm -rf "${ISO_DIR}"
          git clone --no-checkout "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "${ISO_DIR}"
          git -C "${ISO_DIR}" fetch origin "${TARGET_BASE_SHA}" "${TARGET_HEAD_SHA}" --no-tags
          git -C "${ISO_DIR}" checkout --detach "${TARGET_BASE_SHA}"
        fi
        git -C "${ISO_DIR}" checkout -B "tonic/agent/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TARGET_BASE_SHA:0:7}" "${TARGET_BASE_SHA}"
        git -C "${ISO_DIR}" config user.name "mergetonic-agent"
        git -C "${ISO_DIR}" config user.email "mergetonic-agent@users.noreply.github.com"
        {
          echo "TONIC_AGENT_ISOLATED_WORKSPACE=${ISO_DIR}"
          echo "TONIC_TARGET_HEAD_SHA=${TARGET_HEAD_SHA}"
        } >> "${GITHUB_ENV}"
    - name: Install Tonic + agent
      shell: bash
      env:
        TONIC_V: ${{ inputs.tonic_version }}
        TONIC_AGENT_V: ${{ inputs.tonic_github_agent_version }}
      run: |
        if [ -f "${GITHUB_WORKSPACE}/merge-tonic-lib/pyproject.toml" ]; then
          pip install -e "${GITHUB_WORKSPACE}/merge-tonic-lib"
          pip install -e "${GITHUB_WORKSPACE}/agents/github-action-agent"
        elif [ -f "${GITHUB_ACTION_PATH}/pyproject.toml" ]; then
          pip install "tonic==${TONIC_V}"
          pip install -e "${GITHUB_ACTION_PATH}"
        else
          pip install "tonic==${TONIC_V}"
          pip install "mergetonic-github-agent==${TONIC_AGENT_V}"
        fi
    - uses: actions/setup-node@v6
      if: ${{ inputs.enable_ast_hydration == 'true' }}
      with:
        node-version: "20"
    - name: Install ast-grep (sg) for hydration
      if: ${{ inputs.enable_ast_hydration == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        npm install -g "@ast-grep/cli@${{ inputs.ast_grep_version }}"
        command -v sg
        sg --version
    - id: run_agent
      name: Run agent
      shell: bash
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_COMMENT_MODE: ${{ inputs.comment_mode }}
        INPUT_VERBOSITY: ${{ inputs.verbosity }}
        INPUT_MAX_INLINE_COMMENTS_PER_FILE: ${{ inputs.max_inline_comments_per_file }}
        INPUT_MAX_SUGGESTION_LINES: ${{ inputs.max_suggestion_lines }}
        INPUT_ENABLE_AI: ${{ inputs.enable_ai }}
        INPUT_ENABLE_CHECKS: ${{ inputs.enable_checks }}
        INPUT_AUTHOR_MODE: ${{ inputs.author_mode }}
        INPUT_AUTHOR_ALIAS_LEFT: ${{ inputs.author_alias_left }}
        INPUT_AUTHOR_ALIAS_RIGHT: ${{ inputs.author_alias_right }}
        INPUT_INTENT_PAIR: ${{ inputs.intent_pair }}
        INPUT_ENABLE_AST_HYDRATION: ${{ inputs.enable_ast_hydration }}
        INPUT_AST_HYDRATION_EXTRA_ARGS: ${{ inputs.ast_hydration_extra_args }}
        INPUT_AST_HYDRATION_SUBCOMMAND: ${{ inputs.ast_hydration_subcommand }}
        INPUT_AST_HYDRATION_STRICT: ${{ inputs.ast_hydration_strict }}
        INPUT_HYDRATION_USER_QUERY: ${{ inputs.hydration_user_query }}
        INPUT_HYDRATION_FOLLOW_UP: ${{ inputs.hydration_follow_up }}
        INPUT_HYDRATION_PRIOR_RUN: ${{ inputs.hydration_prior_run }}
        INPUT_HYDRATION_QUESTION_MODE: ${{ inputs.hydration_question_mode }}
        INPUT_MERGE_LLM_INCLUDE_RUN_SUMMARY: ${{ inputs.merge_llm_include_run_summary }}
        INPUT_GITHUB_LOGIN_LEFT: ${{ inputs.github_login_left }}
        INPUT_GITHUB_LOGIN_RIGHT: ${{ inputs.github_login_right }}
        INPUT_HYDRATE_MODE: ${{ inputs.hydrate_mode }}
        INPUT_MERGE_ENGINE: ${{ inputs.merge_engine }}
        INPUT_ENABLE_BLAME: ${{ inputs.enable_blame }}
        INPUT_BLAME_MAX_COMMITS: ${{ inputs.blame_max_commits }}
        TONIC_AGENT_REPORT_PATH: ${{ inputs.report_path }}
        TONIC_CHROMA_URL: ${{ inputs.tonic_chroma_url }}
        TONIC_CHROMA_COLLECTION: ${{ inputs.tonic_chroma_collection }}
        TONIC_RETRIEVAL_BACKEND: ${{ inputs.tonic_retrieval_backend }}
        TONIC_EMBEDDING_BASE_URL: ${{ inputs.tonic_embedding_base_url }}
        TONIC_EMBEDDING_BACKEND: ${{ inputs.tonic_embedding_backend }}
        HF_TOKEN: ${{ inputs.hf_token }}
        TONIC_LLM_BACKEND: ${{ inputs.tonic_llm_backend }}
        TONIC_HF_CHAT_MODEL: ${{ inputs.tonic_hf_chat_model }}
        TONIC_HF_EMBED_MODEL: ${{ inputs.tonic_hf_embed_model }}
        TONIC_HF_INFERENCE_PROVIDER: ${{ inputs.tonic_hf_inference_provider }}
        GITHUB_TOKEN: ${{ inputs.token }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: python -m tonic_agent
    - name: Cleanup isolated git workspace
      if: ${{ always() && inputs.merge_engine == 'git' }}
      shell: bash
      run: |
        if [ -n "${TONIC_AGENT_ISOLATED_WORKSPACE}" ] && [ -d "${TONIC_AGENT_ISOLATED_WORKSPACE}" ]; then
          git worktree remove "${TONIC_AGENT_ISOLATED_WORKSPACE}" --force || rm -rf "${TONIC_AGENT_ISOLATED_WORKSPACE}"
        fi
