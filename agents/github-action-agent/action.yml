name: Tonic Agent
description: Post Tonic merge visualization comments on pull requests
inputs:
  token:
    description: GitHub token with PR comment permissions
    required: true
  comment_mode:
    description: summary-only | file+inline | inline-only | all
    required: false
    default: all
  verbosity:
    description: low | medium | high
    required: false
    default: medium
  max_inline_comments_per_file:
    description: Cap for inline review threads per file
    required: false
    default: "20"
  max_suggestion_lines:
    description: Max lines per GitHub suggestion block (use 0 for uncapped; GitHub may still reject very large bodies)
    required: false
    default: "200"
  enable_ai:
    description: "true to enable optional AI (requires API keys)"
    required: false
    default: "false"
  enable_checks:
    description: "true to post a GitHub Check run with annotations (requires checks:write on the token)"
    required: false
    default: "false"
  author_mode:
    description: "git-merge hydration: base-head | human | ref (author tags on Tonic markers)"
    required: false
    default: base-head
  author_alias_left:
    description: Optional explicit author tag for base (left) side
    required: false
    default: ""
  author_alias_right:
    description: Optional explicit author tag for head (right) side
    required: false
    default: ""
  intent_pair:
    description: "Optional left,right intent tags, e.g. preserve_base,prefer_head"
    required: false
    default: ""
  github_login_left:
    description: Optional GitHub login for left author tag when author_mode is not ref
    required: false
    default: ""
  github_login_right:
    description: Optional GitHub login for right author tag
    required: false
    default: ""
  hydrate_mode:
    description: "pr-diff (compare API) or symmetric-union (full tree union); used only when merge_engine=api"
    required: false
    default: pr-diff
  merge_engine:
    description: "git (default, real git merge in isolated workspace) or api"
    required: false
    default: git
  report_path:
    description: "VS Code Import merge report — writes merge-tonic-report JSON here; conflicted files always include annotated_lines (no need for verbosity high on the artifact)."
    required: false
    default: ""
  enable_blame:
    description: "true to include optional blame metadata in report/comments"
    required: false
    default: "false"
  blame_max_commits:
    description: "Maximum commit ids to include per side in blame summaries"
    required: false
    default: "3"
  tonic_version:
    description: "PyPI version of tonic when not using the mergetonic workspace (editable install)"
    required: false
    default: "0.1.0"
  tonic_github_agent_version:
    description: "PyPI version of mergetonic-github-agent when not using the mergetonic workspace"
    required: false
    default: "0.1.0"
outputs:
  status:
    description: "Run status (ok or demo)"
    value: ${{ steps.run_agent.outputs.status }}
  files_analyzed:
    description: "Number of files analyzed by the agent"
    value: ${{ steps.run_agent.outputs.files_analyzed }}
  conflicted_files:
    description: "Number of files with conflict markers"
    value: ${{ steps.run_agent.outputs.conflicted_files }}
  report_path:
    description: "Report path if requested"
    value: ${{ steps.run_agent.outputs.report_path }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - uses: actions/checkout@v4
      if: ${{ inputs.merge_engine == 'git' }}
      with:
        fetch-depth: 0
    - name: Capture immutable PR targets
      shell: bash
      run: |
        {
          echo "TONIC_TARGET_BASE_SHA=${{ github.event.pull_request.base.sha }}"
          echo "TONIC_TARGET_HEAD_SHA=${{ github.event.pull_request.head.sha }}"
          echo "TONIC_TARGET_BASE_BRANCH=${{ github.event.pull_request.base.ref }}"
        } >> "${GITHUB_ENV}"
    - name: Prepare isolated git workspace
      if: ${{ inputs.merge_engine == 'git' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        TARGET_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        : "${TARGET_BASE_SHA:?missing pull_request.base.sha}"
        : "${TARGET_HEAD_SHA:?missing pull_request.head.sha}"
        if ! git fetch origin "${TARGET_BASE_SHA}" "${TARGET_HEAD_SHA}" --no-tags; then
          : "${PR_NUMBER:?missing pull_request.number}"
          git fetch origin "${TARGET_BASE_SHA}" "refs/pull/${PR_NUMBER}/head" --no-tags
          TARGET_HEAD_SHA="$(git rev-parse FETCH_HEAD)"
        fi
        ISO_DIR="${RUNNER_TEMP}/tonic-agent-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        if ! git worktree add --detach "${ISO_DIR}" "${TARGET_BASE_SHA}"; then
          rm -rf "${ISO_DIR}"
          git clone --no-checkout "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "${ISO_DIR}"
          git -C "${ISO_DIR}" fetch origin "${TARGET_BASE_SHA}" "${TARGET_HEAD_SHA}" --no-tags
          git -C "${ISO_DIR}" checkout --detach "${TARGET_BASE_SHA}"
        fi
        git -C "${ISO_DIR}" checkout -B "tonic/agent/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TARGET_BASE_SHA:0:7}" "${TARGET_BASE_SHA}"
        git -C "${ISO_DIR}" config user.name "mergetonic-agent"
        git -C "${ISO_DIR}" config user.email "mergetonic-agent@users.noreply.github.com"
        {
          echo "TONIC_AGENT_ISOLATED_WORKSPACE=${ISO_DIR}"
          echo "TONIC_TARGET_HEAD_SHA=${TARGET_HEAD_SHA}"
        } >> "${GITHUB_ENV}"
    - name: Install Tonic + agent
      shell: bash
      env:
        TONIC_V: ${{ inputs.tonic_version }}
        TONIC_AGENT_V: ${{ inputs.tonic_github_agent_version }}
      run: |
        if [ -f "${GITHUB_WORKSPACE}/merge-tonic-lib/pyproject.toml" ]; then
          pip install -e "${GITHUB_WORKSPACE}/merge-tonic-lib"
          pip install -e "${GITHUB_WORKSPACE}/agents/github-action-agent"
        elif [ -f "${GITHUB_ACTION_PATH}/pyproject.toml" ]; then
          pip install "tonic==${TONIC_V}"
          pip install -e "${GITHUB_ACTION_PATH}"
        else
          pip install "tonic==${TONIC_V}"
          pip install "mergetonic-github-agent==${TONIC_AGENT_V}"
        fi
    - id: run_agent
      name: Run agent
      shell: bash
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_COMMENT_MODE: ${{ inputs.comment_mode }}
        INPUT_VERBOSITY: ${{ inputs.verbosity }}
        INPUT_MAX_INLINE_COMMENTS_PER_FILE: ${{ inputs.max_inline_comments_per_file }}
        INPUT_MAX_SUGGESTION_LINES: ${{ inputs.max_suggestion_lines }}
        INPUT_ENABLE_AI: ${{ inputs.enable_ai }}
        INPUT_ENABLE_CHECKS: ${{ inputs.enable_checks }}
        INPUT_AUTHOR_MODE: ${{ inputs.author_mode }}
        INPUT_AUTHOR_ALIAS_LEFT: ${{ inputs.author_alias_left }}
        INPUT_AUTHOR_ALIAS_RIGHT: ${{ inputs.author_alias_right }}
        INPUT_INTENT_PAIR: ${{ inputs.intent_pair }}
        INPUT_GITHUB_LOGIN_LEFT: ${{ inputs.github_login_left }}
        INPUT_GITHUB_LOGIN_RIGHT: ${{ inputs.github_login_right }}
        INPUT_HYDRATE_MODE: ${{ inputs.hydrate_mode }}
        INPUT_MERGE_ENGINE: ${{ inputs.merge_engine }}
        INPUT_ENABLE_BLAME: ${{ inputs.enable_blame }}
        INPUT_BLAME_MAX_COMMITS: ${{ inputs.blame_max_commits }}
        TONIC_AGENT_REPORT_PATH: ${{ inputs.report_path }}
        GITHUB_TOKEN: ${{ inputs.token }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: python -m tonic_agent
    - name: Cleanup isolated git workspace
      if: ${{ always() && inputs.merge_engine == 'git' }}
      shell: bash
      run: |
        if [ -n "${TONIC_AGENT_ISOLATED_WORKSPACE}" ] && [ -d "${TONIC_AGENT_ISOLATED_WORKSPACE}" ]; then
          git worktree remove "${TONIC_AGENT_ISOLATED_WORKSPACE}" --force || rm -rf "${TONIC_AGENT_ISOLATED_WORKSPACE}"
        fi
