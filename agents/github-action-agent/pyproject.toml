[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mergetonic-github-agent"
version = "0.1.0"
description = "GitHub Action agent for Tonic merge visualization and optional AI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Unlicense" }
dependencies = ["mergetonic>=0.1.0,<1"]

[project.urls]
Documentation = "https://github.com/mergetonic/common/wiki/GitHub-Agent-Python"
Repository = "https://github.com/mergetonic/common"
Issues = "https://github.com/mergetonic/common/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
tonic-agent = "tonic_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
