name: Publish vsmt

on:
  workflow_dispatch:
    inputs:
      publish_marketplace:
        required: true
        type: boolean
        default: false

jobs:
  publish:
    if: inputs.publish_marketplace == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run compile
      - run: npx --yes @vscode/vsce publish --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
