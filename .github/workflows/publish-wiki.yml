name: Publish Wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki-src/**"
      - ".github/workflows/publish-wiki.yml"
      - ".github/workflows/publish-wiki-callable.yml"
      - ".github/workflows/wiki-publish-manual.yml"
      - "scripts/docs/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run publish logic without pushing
        required: true
        type: boolean
        default: false

jobs:
  publish:
    permissions:
      contents: write
    uses: ./.github/workflows/publish-wiki-callable.yml
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    secrets: inherit
