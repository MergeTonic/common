name: Contributor Policy Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  contributor-policy-gate:
    if: github.actor != 'github-actions[bot]' && !startsWith(github.head_ref, 'tonic/agent/') && !startsWith(github.head_ref, 'sync/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Evaluate contributor acceptance policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGETONIC_COMMON_REPO: mergetonic/common
        run: |
          python scripts/policy/contributor_acceptance.py gate
