name: Action Hydration Smoke

on:
  pull_request:
    paths:
      - "agents/github-action-agent/**"
      - "agents/github-action-agent-node/**"
      - "merge-tonic-lib/**"
      - "packages/tonic-core/**"
      - "docs/hydration-chroma-version-pins.json"
      - "docs/hydration-chroma-runtime.md"
  workflow_dispatch:

env:
  TONIC_CHROMA_SERVER_IMAGE: chromadb/chroma:0.5.23
  TONIC_CHROMADB_PY_VERSION: "0.5.23"
  TONIC_CHROMADB_NPM_VERSION: "0.5.23"
  TONIC_CHROMA_HEARTBEAT_PATH: /api/v2/heartbeat

jobs:
  python-action-hydration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate hydration pin contract
        run: |
          python - <<'PY'
import json
from pathlib import Path
pins = json.loads(Path("docs/hydration-chroma-version-pins.json").read_text(encoding="utf-8"))
assert pins["server_image"] == "chromadb/chroma:0.5.23"
assert pins["python_chromadb"] == "0.5.23"
assert pins["npm_chromadb"] == "0.5.23"
assert pins["heartbeat_path"] == "/api/v2/heartbeat"
print("hydration pin contract ok")
PY
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify Python action metadata
        run: |
          python - <<'PY'
from pathlib import Path
text = Path("agents/github-action-agent/action.yml").read_text(encoding="utf-8")
assert "runs:" in text
assert "using: composite" in text
assert "tonic_version" in text
assert "tonic_github_agent_version" in text
print("python action.yml contract ok")
PY

  node-action-hydration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate pinned Chroma metadata appears in workflow
        run: |
          test -n "${TONIC_CHROMA_SERVER_IMAGE}"
          test -n "${TONIC_CHROMA_HEARTBEAT_PATH}"
          echo "Using pinned server image: ${TONIC_CHROMA_SERVER_IMAGE}"
          echo "Using pinned heartbeat path: ${TONIC_CHROMA_HEARTBEAT_PATH}"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Exercise heartbeat readiness gate before hydration CLI
        run: |
          python - <<'PY'
import os
import threading
import time
import urllib.request
from http.server import BaseHTTPRequestHandler, HTTPServer

heartbeat_path = os.environ["TONIC_CHROMA_HEARTBEAT_PATH"]
port = 8011

class Handler(BaseHTTPRequestHandler):
    def do_GET(self):
        if self.path == heartbeat_path:
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b'{"ok":true}')
            return
        self.send_response(404)
        self.end_headers()

    def log_message(self, fmt, *args):
        return

server = HTTPServer(("127.0.0.1", port), Handler)
thread = threading.Thread(target=server.serve_forever, daemon=True)
thread.start()

url = f"http://127.0.0.1:{port}{heartbeat_path}"
deadline = time.time() + 10
ready = False
while time.time() < deadline:
    try:
        with urllib.request.urlopen(url, timeout=1) as resp:
            if resp.status == 200:
                ready = True
                break
    except Exception:
        time.sleep(0.2)

server.shutdown()
if not ready:
    raise SystemExit(f"heartbeat readiness gate failed for {url}")
print(f"heartbeat gate ok: {url}")
PY
      - run: npm ci
      - run: npm run build -w @mergetonic/core -w @mergetonic/github-agent
      - name: Verify Node action metadata
        run: |
          node -e "const fs=require('fs'); const y=fs.readFileSync('agents/github-action-agent-node/action.yml','utf8'); if(!y.includes('using: composite')||!y.includes('tonic_github_agent_version')) process.exit(1);"
